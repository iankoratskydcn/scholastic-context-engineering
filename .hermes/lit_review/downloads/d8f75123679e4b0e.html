    <section>
      <h2>Welcome to the online Arabic and Latin Corpus</h2>
      <p>
        The Arabic and Latin Corpus is a digital collection of Arabic-Latin
        translations of the 10<sup>th</sup> to 14<sup>th</sup> centuries AD.
      </p>
      <p>
        The Corpus has a double aim: to improve our understanding of the Arabic
        influence in Europe, especially by compiling a comprehensive database
        of texts, translators and authors, and to provide citable digital
        editions of as many of these texts as possible, either from modern editions
        or from important textual witnesses. 
      </p>
      <p>
        At the moment, the Corpus
        consists of 209 digital texts.
	For a digital dictionary of the vocabulary of the Arabic–Latin translations of
	the Middle Ages see the <a href="https://www.arabic-latin-glossary.philosophie.uni-wuerzburg.de">Arabic and Latin Glossary</a>.
      </p>
      <p>
  The corpus is published on this website at irregular intervals. Archived snapshots 
  of the XML files on which the latest releases are based can be found in a citable
  format on <a href="https://zenodo.org/communities/alcorpus">Zenodo</a>.
      </p>
    </section>
